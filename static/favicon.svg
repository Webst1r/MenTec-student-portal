    </rect>
    <rect x="18" y="14" width="3"  height="36">
      <animate attributeName="height" values="36;28;36" dur="1.4s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="14;18;14" dur="1.4s" begin="0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="14" width="5"  height="36">
