{% extends "public/_layout.html" %}
{% block title %}Log in — Mentec{% endblock %}
{% block content %}
<div class="container" style="max-width:480px">
  <h1>Welcome back</h1>
  <p class="muted">Log in to your student portal.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form class="stacked" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}"/>
    <div><label>Email</label><input type="email" name="email" required autofocus/></div>
    <div><label>Password</label><input type="password" name="password" required/></div>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:14px">No account? <a href="/signup">Sign up</a></p>
  <p class="muted" style="font-size:13px;margin-top:24px">
    Demo: <code>student@mentec.test</code> / <code>student123</code>
  </p>
</div>
{% endblock %}
